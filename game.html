rrowLeft')K.L=1;if(e.key==='ArrowRight')K.R=1;if(e.key==='ArrowUp'||e.key===' '){e.preventDefault();G.jump();}});\ndocument.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')K.L=0;if(e.key==='ArrowRight')K.R=0;if(e.key==='ArrowUp')K.U=0;});\n\nconst LW=2600;let m,ens,coins,plats,parts,cam,score,cns,lvs,run,raf,flagX=2400;\n\nfunction initLevel(){plats=[]; ens=[]; coins=[]; parts=[];for(let x=0;x<LW;x+=T){if((x>460&&x<540)||(x>920&&x<980)) continue;for(let yy=0;yy<3;yy++) plats.push({x,y:H-T*(2-yy),w:T,h:T,t:'g'});}\nconst bs=[{x:180,y:H-T*5,w:T*3,t:'b'},{x:260,y:H-T*7,w:T,t:'q'},{x:300,y:H-T*5,w:T,t:'q'},{x:340,y:H-T*5,w:T*2,t:'b'},{x:480,y:H-T*4,w:T*4,t:'g'},{x:540,y:H-T*6,w:T*3,t:'g'},{x:600,y:H-T*8,w:T*2,t:'g'},{x:700,y:H-T*5,w:T*2,t:'q'},{x:760,y:H-T*5,w:T*3,t:'b'},{x:840,y:H-T*6,w:T*4,t:'b'},{x:860,y:H-T*8,w:T,t:'q'},{x:1000,y:H-T*4,w:T*4,t:'g'},{x:1060,y:H-T*6,w:T*3,t:'g'},{x:1160,y:H-T*5,w:T*3,t:'b'},{x:1200,y:H-T*7,w:T,t:'q'},{x:1300,y:H-T*4,w:T*5,t:'g'},{x:1560,y:H-T*3,w:T*3,t:'g'},{x:1600,y:H-T*5,w:T*3,t:'g'},{x:1640,y:H-T*7,w:T*3,t:'g'},{x:1720,y:H-T*4,w:T*6,t:'b'},{x:1860,y:H-T*5,w:T*4,t:'g'},{x:1960,y:H-T*7,w:T*3,t:'q'},{x:2060,y:H-T*4,w:T*5,t:'b'},{x:2160,y:H-T*5,w:T*3,t:'g'},{x:2260,y:H-T*6,w:T*3,t:'b'},{x:2280,y:H-T*8,w:T,t:'q'}];\nbs.forEach(b=>{for(let xx=0;xx<b.w;xx+=T) plats.push({x:b.x+xx,y:b.y,w:T,h:T,t:b.t,hit:false});});\nconst ep=[360,520,680,840,1000,1160,1340,1560,1720,1900,2080,2260];ep.forEach(x=>{ens.push({x,y:H-T*3,w:T,h:T*1.2,vx:-1.3,vy:0,alive:true,stomp:false,st:0,fr:0,ft:0});});\nconst cp=[220,280,320,560,620,740,880,1020,1200,1340,1600,1660,1860,2060,2160,2300];cp.forEach(x=>{coins.push({x,y:H-T*6,w:8,h:8,got:false,a:Math.random()*6.28,fr:0});});\nm={x:60,y:H-T*4,w:T-4,h:T*1.5,vx:0,vy:0,g:false,d:1,fr:0,ft:0,inv:0,dead:false};cam={x:0};}\n\nfunction drawBG(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5c94fc'); g.addColorStop(1,'#9cb8f8');cx.fillStyle=g; cx.fillRect(0,0,W,H);}\nfunction drawSprite(spr,x,y,flipX){cx.save();if(flipX){cx.translate(x+spr.width/SC*SC,y);cx.scale(-1,1);cx.drawImage(spr,0,0,spr.width,spr.height);}else cx.drawImage(spr,x,y,spr.width,spr.height);cx.restore();}\nfunction drawTiles(){plats.forEach(p=>{const px=p.x-cam.x;if(px+p.w<-T||px>W+T) return;const py=p.y;if(p.t==='g') cx.drawImage(SPR.ground,px,py,T,T);else if(p.t==='b'&&!p.hit) cx.drawImage(SPR.brick,px,py,T,T);else if(p.t==='b'&&p.hit){cx.fillStyle='#887060';cx.fillRect(px,py,T,T);cx.strokeStyle='#6a5848';cx.strokeRect(px+0.5,py+0.5,T-1,T-1);}else if(p.t==='q'&&!p.hit) cx.drawImage(SPR.q,px,py,T,T);else if(p.t==='q'&&p.hit){cx.fillStyle='#887060';cx.fillRect(px,py,T,T);cx.strokeStyle='#6a5848';cx.strokeRect(px+0.5,py+0.5,T-1,T-1);}});}\nfunction drawCoins(){coins.forEach(c=>{if(c.got) return;c.a+=0.07;c.fr=(c.fr+0.15)%4;const px=c.x-cam.x;const py=c.y+Math.sin(c.a)*3;const scx=Math.abs(Math.cos(c.a*0.5))*0.8+0.2;cx.save();cx.translate(px+c.w/2,py+c.h/2);cx.scale(scx,1);cx.drawImage(SPR.coin,-c.w*SC/2,-c.h*SC/2,c.w*SC,c.h*SC);cx.restore();});}\nfunction drawEnemies(){ens.forEach(e=>{if(!e.alive&&e.st<=0) return;const px=e.x-cam.x;const py=e.y;if(e.stomp) {} else cx.drawImage(SPR.gr,px-2,py,14*SC,14*SC);});}\nfunction drawMario(){if(m.dead&&m.vy>8) return;const px=m.x-cam.x;const py=m.y;const flash=m.inv>0&&Math.floor(m.inv/4)%2;if(flash) return;let spr;if(!m.g) spr=SPR.mj;else if(K.L||K.R){spr=Math.floor(m.fr/8)%2?SPR.mr1:SPR.mr2;}else spr=SPR.mr1;drawSprite(spr,px,py,m.d<0);}\nfunction drawParticles(){parts=parts.filter(p=>p.l>0);parts.forEach(p=>{cx.globalAlpha=p.l/p.ml;cx.fillStyle=p.c;cx.fillRect(p.x-cam.x,p.y,p.s,p.s);p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.l--;});cx.globalAlpha=1;}\nfunction addParts(x,y,col,n=7){for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*5,vy:-Math.random()*4-2,s:Math.random()*4+2,c:col,l:22,ml:22});}\nfunction drawFlag(){const fx=flagX-cam.x;cx.fillStyle='#b0b0b0';cx.fillRect(fx,H-T*12,6,T*10);cx.fillStyle='#d0d0d0';cx.fillRect(fx+1,H-T*12,2,T*10);cx.fillStyle='#00cc00';cx.beginPath();cx.moveTo(fx+6,H-T*12);cx.lineTo(fx+6,H-T*12+28);cx.lineTo(fx+36,H-T*12+14);cx.fill();const cax=flagX+40-cam.x;cx.fillStyle='#aaaaaa';cx.fillRect(cax,H-T*6,T*5,T*4);[0,T,T*2,T*3,T*4].forEach((ox,i)=>{if(i%2===0) cx.fillRect(cax+ox,H-T*7,T,T);});cx.fillStyle='#555';cx.fillRect(cax+T*2,H-T*4,T,T*2);cx.fillRect(cax+T,H-T*5,T,T);cx.fillRect(cax+T*3,H-T*5,T,T);}\nfunction collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}\nfunction update(){if(!run) return;if(!m.dead){if(K.L){m.vx=Math.max(m.vx-0.6,-4);m.d=-1;}else if(K.R){m.vx=Math.min(m.vx+0.6,4);m.d=1;}else m.vx*=0.78;m.vy=Math.min(m.vy+0.45,12);m.x+=m.vx;m.y+=m.vy;m.fr+=1;m.x=Math.max(cam.x,m.x);m.g=false;plats.forEach(p=>{const pm={x:p.x,y:p.y,w:p.w,h:p.h};if(m.x+m.w>p.x&&m.x<p.x+p.w){if(m.vy>=0&&m.y+m.h>p.y&&m.y+m.h<p.y+p.h+12){m.y=p.y-m.h;m.vy=0;m.g=true;}if(m.vy<0&&m.y<p.y+p.h&&m.y>p.y-T*0.5){m.vy=Math.abs(m.vy)*0.4;m.y=p.y+p.h;if(!p.hit&&(p.t==='q'||p.t==='b')){p.hit=true;addParts(p.x+T/2,p.y,p.t==='q'?'#f0a800':'#c84c0c',9);if(p.t==='q'){score+=100;cns++;}}}}});if(m.y>H+60){die();return;}if(m.inv>0)m.inv--;if(m.x>flagX&&!m._win){m._win=true;setTimeout(()=>win(),1200);}} else {m.vy+=0.4;m.y+=m.vy;if(m.y>H+60){if(lvs>0){initLevel();m.dead=false;run=true;return;}else{gameOver();}}}ens.forEach(e=>{if(!e.alive){if(e.st>0)e.st--;return;}e.x+=e.vx;e.vy+=0.38;e.y+=e.vy;e.g=false;plats.forEach(p=>{if(e.x+e.w>p.x&&e.x<p.x+p.w&&e.vy>=0&&e.y+e.h>p.y&&e.y+e.h<p.y+p.h+8){e.y=p.y-e.h;e.vy=0;e.g=true;}});if(e.y>H+40){e.alive=false;return;}if(e.x<cam.x-20||e.x>cam.x+W+20) e.vx=-e.vx;if(!m.dead&&e.alive){const mbox={x:m.x,y:m.y,w:m.w,h:m.h};const ebox={x:e.x,y:e.y,w:e.w,h:e.h};if(collide(mbox,ebox)){if(m.vy>1&&m.y+m.h<e.y+e.h*0.55){e.alive=false;e.stomp=true;e.st=30;m.vy=-8;score+=200;addParts(e.x+e.w/2,e.y,'#8b4c1a',8);}else if(m.inv<=0){die();}}}});coins.forEach(c=>{if(c.got) return;if(m.x+m.w>c.x&&m.x<c.x+c.w&&m.y+m.h>c.y&&m.y<c.y+c.h){c.got=true;cns++;score+=50;addParts(c.x,c.y,'#f0a800',5);}});cam.x=Math.max(cam.x,m.x-W*0.38);cam.x=Math.min(cam.x,LW-W);cam.x=Math.max(0,cam.x);document.getElementById('sc').textContent=String(score).padStart(6,'0');document.getElementById('co').textContent='🪙 '+String(cns).padStart(2,'0');document.getElementById('li').textContent='❤ '+lvs;}\nfunction die(){m.dead=true;m.vy=-10;lvs--;document.getElementById('li').textContent='❤ '+lvs;}\nfunction gameOver(){run=false;const ov=document.getElementById('ov');ov.innerHTML=`<h1 style=\"color:#ff4444\">GAME OVER</h1><p style=\"margin:10px 0;font-size:16px\">Score: ${String(score).padStart(6,'0')}</p><p>Pièces: ${cns}</p><button class=\"btn\" onclick=\"G.start()\">▶ REJOUER</button>`;ov.style.display='flex';}\nfunction win(){run=false;const ov=document.getElementById('ov');ov.innerHTML=`<h1 style=\"color:#FFD700\">🏆 BRAVO !</h1><p style=\"margin:10px 0;font-size:16px\">Score: ${String(score).padStart(6,'0')}</p><p>Pièces: ${cns}</p><button class=\"btn\" onclick=\"G.start()\">▶ REJOUER</button>`;ov.style.display='flex';}\nfunction frame(){cx.clearRect(0,0,W,H);drawBG();drawTiles();drawFlag();drawCoins();drawEnemies();drawParticles();drawMario();update();raf=requestAnimationFrame(frame);}\nconst G={start(){document.getElementById('ov').style.display='none';score=0;cns=0;lvs=3;initLevel();run=true;if(raf) cancelAnimationFrame(raf);frame();},jump(){if(m&&m.g&&!m.dead){m.vy=-11;m.g=false;}}};\nwindow.G=G;window.K=K;\n  </script>\n</body>
