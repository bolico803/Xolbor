<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avatar</title><style>html,body,#viewport{width:100%;height:100%;margin:0;overflow:hidden}#viewport{touch-action:none}canvas{display:block;width:100%;height:100%}#name{position:absolute;top:0;left:0;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:5px;color:#ffce78;font:bold 18px Arial,sans-serif;text-shadow:0 1px 2px #131b27;visibility:hidden}#badge{display:inline-grid;place-items:center;width:15px;height:15px;transform:rotate(14deg);background:#075bff;color:#ffffff;font:900 14px Arial,sans-serif;text-shadow:none}#badge span{transform:rotate(-14deg);line-height:1}#sound{position:fixed;right:20px;bottom:20px;width:43px;height:43px;border-radius:50%;border:1px solid #ffffff70;background:#263d30b8;color:white;font-size:20px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}#sound:hover{background:#324f3b}#sound:focus-visible{outline:3px solid white}#adventure{position:fixed;top:18px;left:18px;max-width:min(390px,calc(100vw - 36px));padding:11px 15px;border:1px solid #fff6;border-radius:14px;background:#193a2cb8;color:#faffea;font:14px/1.45 Arial,sans-serif;text-shadow:0 1px 3px #172c1f;backdrop-filter:blur(7px);pointer-events:none}#adventure-status{font-weight:700;color:#fff5bf}#adventure-hint{margin-top:3px}#adventure-toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,12px);max-width:80vw;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;background:#193a2cdb;color:#fff9de;padding:11px 17px;border-radius:14px;font:15px/1.35 Arial,sans-serif;text-align:center}#adventure-toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:600px){#adventure{font-size:12px;top:10px;left:10px}} #avatar-toggle{position:fixed;right:20px;top:18px;z-index:3;border:1px solid #ffffff70;border-radius:12px;background:#263d30dc;color:#fffbe7;padding:10px 14px;font:700 14px Arial,sans-serif;cursor:pointer;backdrop-filter:blur(8px)}#avatar-panel{position:fixed;z-index:4;top:70px;right:20px;width:min(550px,calc(100vw - 40px));max-height:calc(100vh - 95px);overflow:auto;box-sizing:border-box;padding:18px;border:1px solid #ffffff70;border-radius:18px;background:#173b2ef2;color:#fffbee;font:14px Arial,sans-serif;box-shadow:0 14px 45px #07150f80;backdrop-filter:blur(12px)}#avatar-panel[hidden]{display:none}#avatar-panel h2{margin:0;font-size:20px}#avatar-panel p{margin:7px 0 14px;color:#d7e8d7}#avatar-close{float:right;width:30px;height:30px;border:0;border-radius:50%;background:#ffffff25;color:white;font-size:22px;cursor:pointer}#avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.avatar-option{min-width:0;padding:6px 4px 9px;border:1px solid #ffffff40;border-radius:12px;background:#ffffff10;color:white;cursor:pointer;font:600 12px Arial,sans-serif}.avatar-option:hover,.avatar-option:focus-visible,.avatar-option[aria-pressed=true]{background:#ffffff30;outline:2px solid #d4e99c}.avatar-option img{display:block;width:100%;height:128px;object-fit:contain}.avatar-option span{display:block}.avatar-option:disabled{opacity:.5;cursor:default}#avatar-message{min-height:1em;margin-top:10px;color:#ffe4a1} @media(max-width:520px){#avatar-toggle{top:auto;bottom:20px;right:75px}#avatar-panel{top:55px;right:10px;width:calc(100vw - 20px);max-height:calc(100vh - 125px)}#avatar-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.avatar-option img{height:100px}}#badge[hidden]{display:none}.profile-notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:22px;border-radius:16px;background:#173b2ff0;color:white;font:16px Arial;text-align:center}</style><script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}</script></head><body><div id="viewport" aria-label="Avatar 3D"></div><div id="name"><span id="player-name"></span> <span id="badge" hidden><span>✓</span></span></div><div id="adventure" aria-live="polite"><div id="adventure-status">Saisons 0/4 · Souvenirs 0/4</div><div id="adventure-hint">Approche doucement le papillon lumineux · Maj pour ralentir</div></div><div id="adventure-toast" role="status"></div><button id="sound" type="button" aria-label="Couper le son" title="Couper le son">♫</button><script type="module" src="main.js"></script></body></html>
