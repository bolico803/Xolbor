<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture une catastrophe</title><link rel="stylesheet" href="./interface.css"><script type="importmap">{"imports":{"three":"./three/three.module.js","three/addons/":"./three/addons/"}}</script></head>
<body>
<div id="view"></div><div id="name"><span id="player-name"></span> <span id="badge" hidden><span>✓</span></span></div>
<nav class="game-tools" aria-label="Menu du jeu"><button id="menu-open" class="round" aria-label="Menu Xolbor" aria-expanded="false"><img src="/logo.svg" alt=""></button><button id="chat-open" class="round" aria-label="Ouvrir le chat" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H11l-5 4v-4H4zM8 8h8M8 12h5"/></svg><span id="unread" hidden></span></button></nav>
<section id="chat-panel" class="chat-panel" aria-label="Chat du serveur" hidden><header><strong>Chat du serveur</strong><button id="chat-close" aria-label="Fermer le chat">×</button></header><div id="chat-messages" class="chat-messages" aria-live="polite"><p class="chat-empty">Bienvenue ! Discute avec les joueurs de ce serveur.</p></div><form id="chat-form"><input id="chat-input" maxlength="200" autocomplete="off" aria-label="Ton message" placeholder="Écris un message…"><button type="submit" aria-label="Envoyer">➤</button></form><p id="chat-error" role="status"></p></section>
<div id="menu-overlay" class="menu-overlay" hidden><section class="menu-card" role="dialog" aria-modal="true" aria-labelledby="menu-title"><header><div class="menu-heading"><img src="/logo.svg" alt=""><div><small>CAPTURE UNE CATASTROPHE</small><h1 id="menu-title">Joueurs du serveur</h1></div></div><button id="menu-close" class="close" aria-label="Fermer le menu">×</button></header><div class="menu-subhead"><span>Dans cette partie</span><span id="player-count">0 / 6</span></div><div id="player-list" class="player-list"></div><footer><button id="leave-game" class="action danger">Quitter</button><button id="respawn" class="action">Réapparaître</button><button id="resume" class="action primary">Reprendre</button></footer></section></div>
<div id="buy-prompt" hidden><span id="buy-info"></span><button id="buy-button" type="button">Maintenir E pour acheter</button></div><div id="dollars" aria-label="Argent dans le jeu">💵 $<span id="dollar-value">100</span></div><div id="message" role="status"></div><div id="error"></div><script src="/socket.io/socket.io.js"></script><script type="module" src="main.js"></script></body></html>
